luxo.</p></article><article data-component-id="c2" class="component type-lista"><h2>Objetivos</h2><ul><li>Clareza</li><li>Legibilidade</li><li>Exportação editável</li></ul></article><article data-component-id="c3" class="component type-timeline"><h2>Processo</h2><svg role="img" aria-label="Processo" viewBox="0 0 100 100"><line x1="15" y1="50" x2="85" y2="50" stroke="#137a80" stroke-width=".7"/><ellipse cx="20" cy="50" rx="7.5" ry="10" fill="#63bec2" fill-opacity=".65" stroke="#137a80" stroke-width=".5"/><text x="20" y="47.6" text-anchor="middle" dominant-baseline="middle" style="font-size:4px"><tspan x="20" dy="0">Planej</tspan><tspan x="20" dy="4.8">ar</tspan></text><ellipse cx="50" cy="50" rx="7.5" ry="10" fill="#f7c528" fill-opacity=".65" stroke="#137a80" stroke-width=".5"/><text x="50" y="50" text-anchor="middle" dominant-baseline="middle" style="font-size:4px"><tspan x="50" dy="0">Criar</tspan></text><ellipse cx="80" cy="50" rx="7.5" ry="10" fill="#63bec2" fill-opacity=".65" stroke="#137a80" stroke-width=".5"/><text x="80" y="47.6" text-anchor="middle" dominant-baseline="middle" style="font-size:4px"><tspan x="80" dy="0">Aprese</tspan><tspan x="80" dy="4.8">ntar</tspan></text></svg></article><article data-component-id="c4" class="component type-grafico-colunas"><h2>Dados sintéticos</h2><svg class="chart" role="img" aria-label="Dados sintéticos" viewBox="0 0 500 310"><path d="M35 15V255H475" fill="none" stroke="#3d3d3d"/><rect x="40" y="145" width="175" height="105" fill="#63bec2"/><rect x="250" y="40" width="175" height="210" fill="#63bec2"/><text x="40" y="280">A</text><text x="250" y="280">B</text></svg><div class="chart-legend"><span style="border-left:8px solid #63bec2;padding:0 8px">Exemplo</span> </div><details><summary>Ver dados</summary><table><tr><th>Categoria</th><th>Exemplo</th></tr><tr><td>A</td><td>10</td></tr><tr><td>B</td><td>20</td></tr></table></details></article></div><footer>Dados sintéticos · Dados sintéticos de QA</footer></section><nav aria-label="Controles da apresenta&#231;&#227;o"><button id="mode" type="button">Um slide por vez</button><button id="prev" type="button" aria-label="Slide anterior">&larr;</button><span id="progress" role="status" aria-live="polite">1 / 1</span><button id="next" type="button" aria-label="Pr&#243;ximo slide">&rarr;</button><button id="fullscreen" type="button">Tela cheia</button></nav><script>(()=>{const slides=Array.from(document.querySelectorAll('.slide'));let index=0,single=false,startX=0;const progress=document.getElementById('progress');function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===index));if(progress)progress.textContent=(index+1)+' / '+slides.length;if(!single)slides[index]?.scrollIntoView({behavior:'smooth'});}document.getElementById('mode')?.addEventListener('click',()=>{single=!single;document.body.classList.toggle('single',single);document.getElementById('mode').textContent=single?'Leitura cont?nua':'Um slide por vez';show(index)});document.getElementById('prev')?.addEventListener('click',()=>show(index-1));document.getElementById('next')?.addEventListener('click',()=>show(index+1));document.getElementById('fullscreen')?.addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);});document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(single&&Math.abs(dx)>60)show(index+(dx<0?1:-1))},{passive:true});const observer=new IntersectionObserver(entries=>{if(single)return;for(const e of entries)if(e.isIntersecting){index=slides.indexOf(e.target);if(progress)progress.textContent=(index+1)+' / '+slides.length;}},{threshold:.5});slides.forEach(s=>observer.observe(s));show(0);})();</script></body></html>
